mcp:
  name: standards-atlas
  transport: streamable-http
  workspace: .atlas/data
  allowed_document_keys: []
  limits:
    max_results: 20
    max_sample_size: 50
    max_clause_characters: 20000
    max_request_body_bytes: 4194304
  expose:
    clause_text: true
    source_paths: false
    internal_metadata: false
  capabilities:
    formula_transcription: false
  http:
    host: 192.168.0.77
    port: 8765
    path: /mcp
    allowed_hosts:
      - localhost:*
      - 127.0.0.1:*
      - 192.168.0.77:*
    allowed_origins:
      - http://localhost:*
      - http://127.0.0.1:*
      - http://192.168.0.77:*
    stateless: true
  auth:
    enabled: true
    token_environment_variable: STANDARDS_ATLAS_MCP_TOKEN
  audit:
    enabled: true
    path: .atlas/data/logs/mcp-audit.jsonl
