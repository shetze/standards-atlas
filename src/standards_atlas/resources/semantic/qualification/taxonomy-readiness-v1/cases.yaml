schema_version: '1.0'
id: taxonomy-readiness-v1
version: '1.0.0'
status: synthetic-engineering-smoke
purpose: Known-by-construction source fixtures; not independent HITL labels or production qualification.
cases:
- id: term-process
  clause_type: term
  heading: inspection process
  text: An ordered collection of inspection activities with defined inputs and results.
  confirm_fields: [clause_type]
  expected_primary_state: fixed
  expected_primary_value: definition
- id: term-role
  clause_type: term
  heading: independent reviewer
  text: A person appointed to examine a work product independently of its author.
  confirm_fields: [clause_type]
  expected_primary_state: fixed
  expected_primary_value: definition
- id: term-technique
  clause_type: term
  heading: boundary testing
  text: A test technique that selects values immediately adjacent to an input boundary.
  confirm_fields: [clause_type]
  expected_primary_state: fixed
  expected_primary_value: definition
- id: term-unconfirmed
  clause_type: term
  heading: boundary testing
  text: A test technique that selects values immediately adjacent to an input boundary.
  confirm_fields: []
  expected_primary_state: hint
- id: objective
  clause_type: objective
  heading: Objectives
  text: The objective of integration testing is to demonstrate that the connected components interact correctly.
  confirm_fields: [clause_type, baseline.heading]
  expected_primary_state: hint
  process_check:
    must_include: [objective]
- id: technique-activity
  clause_type: clause
  heading: Boundary testing procedure
  text: For this technique, select the two values immediately below and above the boundary and compare the measured result with the specified result.
  confirm_fields: [baseline.heading]
  process_check:
    must_include: [activity]
- id: artifact-output
  clause_type: clause
  heading: Inspection record
  parent_heading: Work products
  text: Inspection record produced by performing the inspection specified in this section.
  confirm_fields: [baseline.heading]
  process_check:
    must_include: [output]
- id: requirement-input
  clause_type: requirement
  heading: Input to impact analysis
  text: The approved change request shall be used as input to the impact analysis.
  confirm_fields: [clause_type, baseline.heading]
  expected_primary_state: hint
  process_check:
    must_include: [input]
- id: pure-bibliography-heading
  clause_type: toc
  heading: Bibliography of test techniques
  text: Bibliography of test techniques
  confirm_fields: [baseline.heading]
  process_check:
    must_be_empty: true
- id: pure-technique-heading
  clause_type: toc
  heading: Catalogue of testing techniques
  text: Catalogue of testing techniques
  confirm_fields: [baseline.heading]
  process_check:
    must_be_empty: true
- id: work-product-conflict
  clause_type: objective
  heading: Verification record
  parent_heading: Work products
  text: Verification record produced by the verification activities.
  confirm_fields: [clause_type, baseline.heading]
  expected_primary_state: conflict
  process_check:
    must_include: [output]
- id: technique-with-normative-note
  clause_type: clause
  heading: Inspection technique
  text: 'Apply this inspection technique to the revised components. NOTE: The requirements of Clause 9 do not apply to unchanged components.'
  confirm_fields: [baseline.heading]
  process_check:
    must_include: [activity]
