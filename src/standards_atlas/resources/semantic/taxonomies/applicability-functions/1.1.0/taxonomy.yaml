id: applicability-functions
version: 1.1.0
dimension: applicability_functions
description: Applicability semantics with explicit tie-break rules.
values:
- applicability_condition
- inclusion
- exclusion
- exception
semantics:
  inclusion: Directly names what belongs to the governed scope or population.
  exclusion: Directly names what does not belong to the governed scope or population.
  exception: Carves out a case from an otherwise applicable rule.
  applicability_condition: Makes application of normative content depend on a condition.
  tie_break_rules:
  - exception over exclusion when wording expresses an exception to a general rule
  - applicability_condition over inclusion when a condition governs whether content
    applies
  - local logical conditions do not imply applicability
codes:
  applicability_condition: APC
  inclusion: INC
  exclusion: EXC
  exception: XCP
