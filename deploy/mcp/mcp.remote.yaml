mcp:
  name: standards-atlas
  transport: streamable-http
  workspace: .atlas
  allowed_document_keys: []
  limits:
    max_results: 20
    max_sample_size: 50
    max_clause_characters: 20000
    max_request_body_bytes: 4194304
  expose:
    clause_text: true
  http:
    host: 0.0.0.0
    port: 8765
    path: /mcp
    allowed_origins: []
    stateless: true
  auth:
    enabled: true
    token_environment_variable: STANDARDS_ATLAS_MCP_TOKEN
  audit:
    enabled: true
    path: local/logs/mcp-audit.jsonl
