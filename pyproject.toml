[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "standards-atlas"
version = "0.6.0"
description = "A semantic traceability platform for technical standards."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }

authors = [
    { name = "Sebastian Hetze" }
]

keywords = [
    "requirements",
    "traceability",
    "standards",
    "functional-safety",
    "knowledge-graph",
    "compliance"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]

dependencies = [
    "pydantic>=2.11",
    "typer>=0.16",
    "pyyaml>=6",
    "docling>=2.112,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff",
    "mypy",
]

[project.optional-dependencies]

llm = [
    "sentence-transformers",
    "chromadb",
]

dev = [
    "pytest>=8.4",
    "pytest-cov",
    "ruff",
    "mypy",
]

docs = [
    "mkdocs",
    "mkdocs-material",
]

[project.scripts]
standards-atlas = "standards_atlas.cli:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
markers = [
    "doorstop: tests requiring the installed Doorstop CLI",
    "docling: tests requiring the optional Docling runtime",
]

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["src/standards_atlas"]
