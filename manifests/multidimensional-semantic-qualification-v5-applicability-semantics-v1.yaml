review_imports:
  - run_directory: ../.atlas/data/evaluation/runs/semantic-roles-v1/structure-aware-v2/codex/gpt-5.6-luna
    review_directory: ../local/review/qualification/semantic-roles-v1/structure-aware-v2/codex/gpt-5.6-luna
    local_corpus_root: ../.atlas/data/evaluation/corpora
    overwrite: false
    required: false

consensus:
  enabled: true
  prompt_id: structure-aware
  reasoning_mode_id: disabled
  prompt_selection:
    statement_function: structure-aware
    knowledge_kind: structure-aware
    applicability: structure-aware
    role_relation: reference-aware
  min_models: 3
  strong_threshold: 0.8
  majority_threshold: 0.6
  label_threshold: 0.6
  review_policy:
    review_categories: [disputed, insufficient_evidence]
    accept_majority_min_confidence: 0.67
    accept_majority_min_models: 3
    applicability_min_confidence: 0.75
    role_relation_min_confidence: 0.80
    require_role_relation_evidence: true
  adjudication:
    enabled: true
    model_id: codex-gpt-5.6-luna
    minimum_confidence: 0.70
  structural_priors:
    enabled: true
    confidence: 0.95
  output_directory: ../local/review/qualification/consensus

observations: []

thresholds:
  min_gold_f1: 0.80
  min_gold_coverage: 0.90
  max_gold_f1_stddev: 0.03
  min_prediction_success_rate: 0.98
  min_json_validity_rate: 0.99
  max_truncation_rate: 0.01
  max_mean_duration_seconds: 60
  max_peak_memory_gb: 24
  baseline_prompt_id: structure-aware
  baseline_model_id: qwen3-14b-q4-k-m
  baseline_reasoning_mode_id: disabled
  max_gold_f1_drop: 0.02

semantic_extraction_qualification:
  enabled: true
  model: mistral-small-3.2-24b-instruct-q4-k-m
  timeout_seconds: 240
  ontology_versions:
    - standards-atlas-core@1.1.0
    - functional-safety@1.1.0
  minimum_entity_confidence: 0.60
  minimum_relation_confidence: 0.60
  minimum_ontology_conformance: 1.0
  generate_missing: true
