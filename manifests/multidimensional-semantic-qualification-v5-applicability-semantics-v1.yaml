manifest_type: qualification_matrix
schema_version: "1.5"
matrix_id: multidimensional-semantic-qualification-v5-applicability-semantics
corpus_id: semantic-profile-v1
task: semantic-profile-classification
task_version: 2.4.0
dataset_version: 2.2.0
repetitions: 1

execution:
  mode: cascade
  stages:
    - id: efficient-local
      models:
        - granite-3.3-8b-instruct-q4-k-m
        - ministral-3-8b-instruct-2512-q4-k-m
        - llama-3.1-8b-instruct-q4-k-m
        - smollm3-3b-q4-k-m
      prompts:
        - structure-aware
      apply_to: all
      resolution:
        minimum_successful_models: 3
        minimum_applicability_presence_models: 2
        accepted_categories: [unanimous, strong_consensus, majority_consensus]
        minimum_confidence: 0.60
        escalate_on_knowledge_kind_disagreement: false
        minimum_knowledge_kind_confidence: 0.60
        escalate_on_applicability_disagreement: false
        escalate_on_applicability_presence_disagreement: true
        escalate_on_applicability_polarity_disagreement: true
        escalate_on_role_relation_disagreement: true
    - id: intermediate-escalation
      models:
        - gemma-3-12b-it-q4-k-m
        - mistral-small-3.2-24b-instruct-q4-k-m
        - glm-4-9b-chat-q4-k-m
      prompts:
        - structure-aware
      apply_to: unresolved
      resolution:
        minimum_successful_models: 5
        minimum_applicability_presence_models: 4
        accepted_categories: [unanimous, strong_consensus, majority_consensus]
        minimum_confidence: 0.60
        statement_function_resolution_mode: stage_resolver
        statement_function_resolver_min_confidence: 0.75
        escalate_on_knowledge_kind_disagreement: false
        minimum_knowledge_kind_confidence: 0.60
        escalate_on_applicability_disagreement: false
        escalate_on_applicability_presence_disagreement: false
        escalate_on_applicability_polarity_disagreement: false
        escalate_on_role_relation_disagreement: false
        minimum_applicability_presence_confidence: 0.75
        minimum_applicability_polarity_confidence: 0.75
        minimum_role_relation_confidence: 0.80
    - id: escalation
      models:
        - qwen3-14b-q4-k-m
        - exaone-3.5-32b-instruct-q4-k-m
        # - codex-gpt-5.6-luna
      prompts:
        - structure-aware
        - reference-aware
      apply_to: unresolved
  resolution:
    minimum_successful_models: 3
    minimum_applicability_presence_models: 3
    accepted_categories:
      - unanimous
      - strong_consensus
      - majority_consensus
    minimum_confidence: 0.60
    escalate_on_knowledge_kind_disagreement: false
    minimum_knowledge_kind_confidence: 0.60
    escalate_on_applicability_disagreement: false
    escalate_on_applicability_presence_disagreement: true
    escalate_on_applicability_polarity_disagreement: true
    escalate_on_role_relation_disagreement: true


challenger_qualification:
  enabled: true
  repetitions: 1
  models:
    - id: qwen3-8b-q4-k-m
      provider: ramalama
      model_ref: hf.co/Qwen/Qwen3-8B-GGUF:Q4_K_M
      quantization: Q4_K_M
      description: Former intermediate Qwen 3 baseline retained for challenger regression.
      accelerator: gpu
      parameters_billion: 8
      declared_memory_gb: 8
      supported_reasoning_modes: [disabled, enabled]
      generation:
        max_output_tokens: 384
        adaptive_question_max_tokens: 256
        truncation_retry_max_tokens: 512
        reasoning_mode: disabled
        retry_on_truncation: true

    - id: phi-4-14b-q4-k-m
      provider: ramalama
      model_ref: hf.co/bartowski/phi-4-GGUF:Q4_K_M
      quantization: Q4_K_M
      description: Former intermediate Phi-4 baseline retained for challenger regression.
      accelerator: gpu
      parameters_billion: 14
      declared_memory_gb: 12
      generation:
        max_output_tokens: 512
        adaptive_question_max_tokens: 384
        truncation_retry_max_tokens: 768
        reasoning_mode: disabled
        retry_on_truncation: true

    - id: qwen3-32b-q4-k-m
      provider: ramalama
      model_ref: hf.co/Qwen/Qwen3-32B-GGUF:Q4_K_M
      quantization: Q4_K_M
      description: Former final Qwen 3 baseline retained for challenger regression.
      accelerator: gpu
      parameters_billion: 32
      declared_memory_gb: 22
      supported_reasoning_modes: [disabled, enabled]
      generation:
        max_output_tokens: 768
        adaptive_question_max_tokens: 512
        truncation_retry_max_tokens: 1024
        reasoning_mode: disabled
        retry_on_truncation: true
  groups:
    - id: efficient-local
      incumbents: [smollm3-3b-q4-k-m]
      challengers: [qwen3-8b-q4-k-m]
    - id: intermediate-escalation
      incumbents: [glm-4-9b-chat-q4-k-m]
      challengers: [phi-4-14b-q4-k-m]
    - id: final-escalation
      incumbents: [qwen3-14b-q4-k-m, exaone-3.5-32b-instruct-q4-k-m]
      challengers: [qwen3-32b-q4-k-m]
prompts:
  - id: content-only
    prompt_version: content-only-v6
    max_output_tokens: 512
    adaptive_interview: true
    description: Benchmark control using clause text only; retained for prompt qualification, not production cascade execution.

  - id: structure-aware
    prompt_version: structure-aware-v8
    max_output_tokens: 640
    adaptive_interview: true
    description: Primary production qualification prompt with presence-first binary applicability polarity and deterministic CBox context.

  - id: reference-aware
    prompt_version: evidence-first-v6
    max_output_tokens: 768
    adaptive_interview: true
    description: Escalation prompt adding resolved reference evidence to the deterministic CBox context.

  - id: bounded-reasoning
    prompt_version: bounded-reasoning-v6
    max_output_tokens: 768
    description: Benchmark challenger for reasoning-mode qualification; retained outside production cascade execution.

reasoning_modes:
  - id: disabled
    enabled: false
    optional: false
    description: Direct classification without model-native thinking.

  - id: enabled
    enabled: true
    optional: true
    description: Optional model-native thinking for selected comparison runs.

models:
  - id: codex-gpt-5.6-luna
    provider: codex
    model_ref: gpt-5.6-luna
    repetitions: 1
    description: Codex reference candidate using the Standards Atlas MCP server.
    accelerator: remote

  - id: llama-3.1-8b-instruct-q4-k-m
    provider: ramalama
    model_ref: hf.co/bartowski/Meta-Llama-3.1-8B-Instruct-GGUF:Q4_K_M
    quantization: Q4_K_M
    description: Independent 8B Llama-family candidate for intermediate cascade resolution.
    accelerator: gpu
    parameters_billion: 8
    declared_memory_gb: 8
    generation:
      max_output_tokens: 384
      adaptive_question_max_tokens: 256
      truncation_retry_max_tokens: 512
      reasoning_mode: disabled
      retry_on_truncation: true

  - id: ministral-3-8b-instruct-2512-q4-k-m
