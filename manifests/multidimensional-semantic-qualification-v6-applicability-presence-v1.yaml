manifest_type: qualification_matrix
schema_version: '1.5'
matrix_id: multidimensional-semantic-qualification-v6-applicability-presence
corpus_id: semantic-profile-v1
task: semantic-profile-classification
task_version: 2.5.0
dataset_version: 2.2.0
repetitions: 1
execution:
  mode: cascade
  stages:
  - id: efficient-local
    models:
    - granite-3.3-8b-instruct-q4-k-m
    - ministral-3-8b-instruct-2512-q4-k-m
    - llama-3.1-8b-instruct-q4-k-m
    - smollm3-3b-q4-k-m
    prompts:
    - applicability-presence
    apply_to: all
    resolution:
      minimum_successful_models: 3
      minimum_applicability_presence_models: 3
      accepted_categories:
      - unanimous
      - strong_consensus
      - majority_consensus
      minimum_confidence: 0.6
      escalate_on_knowledge_kind_disagreement: false
      minimum_knowledge_kind_confidence: 0.6
      escalate_on_applicability_presence_disagreement: true
      escalate_on_role_relation_disagreement: true
  - id: intermediate-escalation
    models:
    - gemma-3-12b-it-q4-k-m
    - mistral-small-3.2-24b-instruct-q4-k-m
    - glm-4-9b-chat-q4-k-m
    prompts:
    - applicability-presence
    apply_to: unresolved
    resolution:
      minimum_successful_models: 5
      minimum_applicability_presence_models: 5
      accepted_categories:
      - unanimous
      - strong_consensus
      - majority_consensus
      minimum_confidence: 0.6
      statement_function_resolution_mode: stage_resolver
      statement_function_resolver_min_confidence: 0.75
      escalate_on_knowledge_kind_disagreement: false
      minimum_knowledge_kind_confidence: 0.6
      escalate_on_applicability_presence_disagreement: false
      minimum_applicability_presence_confidence: 0.75
      escalate_on_role_relation_disagreement: false
      minimum_role_relation_confidence: 0.8
  - id: final-escalation
    models:
    - qwen3-14b-q4-k-m
    - exaone-3.5-32b-instruct-q4-k-m
    prompts:
    - applicability-presence
    apply_to: unresolved
    resolution:
      minimum_successful_models: 5
      minimum_applicability_presence_models: 5
      accepted_categories:
      - unanimous
      - strong_consensus
      - majority_consensus
      minimum_confidence: 0.6
      statement_function_resolution_mode: stage_resolver
      statement_function_resolver_min_confidence: 0.75
      escalate_on_knowledge_kind_disagreement: false
      minimum_knowledge_kind_confidence: 0.6
      escalate_on_applicability_presence_disagreement: false
      minimum_applicability_presence_confidence: 0.75
      escalate_on_role_relation_disagreement: false
      minimum_role_relation_confidence: 0.8
  resolution:
    minimum_successful_models: 3
    minimum_applicability_presence_models: 3
    accepted_categories:
    - unanimous
    - strong_consensus
    - majority_consensus
    minimum_confidence: 0.6
    escalate_on_knowledge_kind_disagreement: false
    minimum_knowledge_kind_confidence: 0.6
    escalate_on_applicability_presence_disagreement: true
    escalate_on_role_relation_disagreement: true
challenger_qualification:
  enabled: false
prompts:
- id: applicability-presence
  prompt_version: structure-aware-v10
  cbox_frame: applicability-isolated-v1
  max_output_tokens: 512
  adaptive_interview: false
  description: Shared multidimensional prompt with applicability represented only
    by applicability_present and isolated from interpreted CBox signals.
reasoning_modes:
- id: disabled
  enabled: false
  optional: false
  description: Direct classification without model-native thinking.
- id: enabled
