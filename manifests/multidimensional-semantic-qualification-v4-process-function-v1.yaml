manifest_type: qualification_matrix
schema_version: '1.6'
matrix_id: process-function-qualification-v1
corpus_id: semantic-profile-v1
task: process-function-classification
task_version: 1.0.0
dataset_version: 2.2.0
repetitions: 1
routing:
  contract_id: functional-safety-semantic-profile
  contract_version: 1.1.0
  minimum_disposition: required
  include_unrouted: false
execution:
  mode: cascade
  stages:
  - id: efficient-local
    models:
    - granite-3.3-8b-instruct-q4-k-m
    - ministral-3-8b-instruct-2512-q4-k-m
    - llama-3.1-8b-instruct-q4-k-m
    - smollm3-3b-q4-k-m
    prompts:
    - content-only
    - structure-aware
    apply_to: all
    resolution:
      minimum_successful_models: 3
      accepted_categories:
      - unanimous
      - strong_consensus
      - majority_consensus
      minimum_confidence: 0.6
      escalate_on_applicability_disagreement: false
      escalate_on_role_relation_disagreement: false
  - id: intermediate-escalation
    models:
    - gemma-3-12b-it-q4-k-m
    - mistral-small-3.2-24b-instruct-q4-k-m
    - glm-4-9b-chat-q4-k-m
    prompts:
    - content-only
    - structure-aware
    apply_to: unresolved
    resolution:
      minimum_successful_models: 3
      accepted_categories:
      - unanimous
      - strong_consensus
      - majority_consensus
      minimum_confidence: 0.6
      escalate_on_applicability_disagreement: false
      escalate_on_role_relation_disagreement: false
  - id: escalation
    models:
    - qwen3-14b-q4-k-m
    - exaone-3.5-32b-instruct-q4-k-m
    prompts:
    - content-only
    - structure-aware
    - reference-aware
    - bounded-reasoning
    apply_to: unresolved
  resolution:
    minimum_successful_models: 3
    accepted_categories:
    - unanimous
    - strong_consensus
    - majority_consensus
    minimum_confidence: 0.6
    escalate_on_applicability_disagreement: false
    escalate_on_role_relation_disagreement: false
prompts:
- id: content-only
  prompt_version: content-only-v1
  max_output_tokens: 384
  description: Focused content-only task prompt.
- id: structure-aware
  prompt_version: structure-aware-v1
  max_output_tokens: 448
  description: Focused prompt with structural context.
- id: reference-aware
  prompt_version: evidence-first-v1
  max_output_tokens: 512
  description: Focused prompt with resolved context/evidence.
- id: bounded-reasoning
  prompt_version: bounded-reasoning-v1
  max_output_tokens: 512
  description: Focused bounded-reasoning prompt.
