schema_version: "1.3"
matrix_id: multidimensional-semantic-qualification-v2
corpus_id: semantic-roles-v1
task_version: 2.0.0
dataset_version: 1.0.0
repetitions: 1

execution:
  mode: cascade
  stages:
    - id: efficient-local
      models:
        - granite-3.3-8b-instruct-q4-k-m
        - gemma-3-12b-it-q4-k-m
        - mistral-small-3.2-24b-instruct-q4-k-m
      prompts:
        - content-only
        - structure-aware
      apply_to: all
    - id: escalation
      models:
        - qwen3-14b-q4-k-m
        - qwen3-32b-q4-k-m
        # - codex-gpt-5.6-luna
      prompts:
        - content-only
        - structure-aware
        - reference-aware
        - bounded-reasoning
      apply_to: unresolved
  resolution:
    minimum_successful_models: 3
    accepted_categories:
      - unanimous
      - strong_consensus
      - majority_consensus
    minimum_confidence: 0.60

prompts:
  - id: content-only
    prompt_version: content-only-v2
    max_output_tokens: 512
    adaptive_interview: true
    description: Clause text without structural context.

  - id: structure-aware
    prompt_version: structure-aware-v2
    max_output_tokens: 640
    adaptive_interview: true
    description: Clause text with reference, title, and hierarchy context.

  - id: reference-aware
    prompt_version: evidence-first-v2
    max_output_tokens: 768
    adaptive_interview: true
    description: Clause text with deterministically resolved internal references.

  - id: bounded-reasoning
    prompt_version: bounded-reasoning-v2
    max_output_tokens: 768
    description: Bounded internal reasoning with concise schema-only output.

reasoning_modes:
  - id: disabled
    enabled: false
    optional: false
    description: Direct classification without model-native thinking.

  - id: enabled
    enabled: true
    optional: true
    description: Optional model-native thinking for selected comparison runs.

models:
  - id: codex-gpt-5.6-luna
    provider: codex
    model_ref: gpt-5.6-luna
    repetitions: 1
    description: Codex reference candidate using the Standards Atlas MCP server.
    accelerator: remote

  - id: qwen3-14b-q4-k-m
    provider: ramalama
    model_ref: hf.co/Qwen/Qwen3-14B-GGUF:Q4_K_M
    quantization: Q4_K_M
    description: Dense multilingual candidate with switchable thinking support.
    accelerator: gpu
    parameters_billion: 14
    declared_memory_gb: 10
    supported_reasoning_modes: [disabled, enabled]
    generation:
      max_output_tokens: 512
      adaptive_question_max_tokens: 384
      truncation_retry_max_tokens: 768
      reasoning_mode: disabled
      retry_on_truncation: true

  - id: qwen3-32b-q4-k-m
    provider: ramalama
    model_ref: hf.co/Qwen/Qwen3-32B-GGUF:Q4_K_M
    quantization: Q4_K_M
    description: Larger Qwen candidate for semantic-quality scaling comparison.
    accelerator: gpu
    parameters_billion: 32
    declared_memory_gb: 22
    supported_reasoning_modes: [disabled, enabled]
    generation:
      max_output_tokens: 768
      adaptive_question_max_tokens: 512
      truncation_retry_max_tokens: 1024
      reasoning_mode: disabled
      retry_on_truncation: true

  - id: gemma-3-12b-it-q4-k-m
    provider: ramalama
    model_ref: hf.co/unsloth/gemma-3-12b-it-GGUF:Q4_K_M
    quantization: Q4_K_M
    description: Compact multilingual Gemma 3 instruction candidate.
    accelerator: gpu
    parameters_billion: 12
    declared_memory_gb: 10
    generation:
      max_output_tokens: 384
      adaptive_question_max_tokens: 256
      truncation_retry_max_tokens: 512
      reasoning_mode: disabled
      retry_on_truncation: true

  - id: mistral-small-3.2-24b-instruct-q4-k-m
    provider: ramalama
    model_ref: hf.co://bartowski/mistralai_Mistral-Small-3.2-24B-Instruct-2506-GGUF:Q4_K_M
    quantization: Q4_K_M
    accelerator: gpu
    parameters_billion: 24
    declared_memory_gb: 17
    generation:
      max_output_tokens: 384
      adaptive_question_max_tokens: 256
      truncation_retry_max_tokens: 512
      reasoning_mode: disabled
      retry_on_truncation: true

  - id: mistral-small-3.2-24b-instruct-q6-k
    provider: ramalama
    model_ref: hf.co://bartowski/mistralai_Mistral-Small-3.2-24B-Instruct-2506-GGUF:Q6_K
    quantization: Q6_K
    accelerator: gpu
    parameters_billion: 24
    declared_memory_gb: 24
    generation:
      max_output_tokens: 384
      adaptive_question_max_tokens: 256
      truncation_retry_max_tokens: 512
      reasoning_mode: disabled
      retry_on_truncation: true

  - id: granite-3.3-8b-instruct-q4-k-m
    provider: ramalama
    model_ref: hf.co/ibm-granite/granite-3.3-8b-instruct-GGUF:Q4_K_M
    quantization: Q4_K_M
    description: Compact Granite baseline used by the local evaluation environment.
    accelerator: gpu
    parameters_billion: 8
    declared_memory_gb: 8
    generation:
      max_output_tokens: 384
      adaptive_question_max_tokens: 256
      truncation_retry_max_tokens: 512
      reasoning_mode: disabled
      retry_on_truncation: true

review_imports:
  - run_directory: ../../runs/semantic-roles-v1/structure-aware-v2/codex/gpt-5.6-luna
    review_directory: ../../runs/semantic-roles-v1/structure-aware-v2/codex/gpt-5.6-luna
    local_corpus_root: ../../corpora
    overwrite: false
    required: false

consensus:
  enabled: true
  prompt_id: structure-aware
  reasoning_mode_id: disabled
  prompt_selection:
    statement_function: structure-aware
    knowledge_kind: structure-aware
    applicability: structure-aware
    responsibility: reference-aware
  min_models: 3
  strong_threshold: 0.8
  majority_threshold: 0.6
  label_threshold: 0.6
  review_policy:
    review_categories: [disputed, insufficient_evidence]
    accept_majority_min_confidence: 0.67
    accept_majority_min_models: 3
    applicability_min_confidence: 0.75
    responsibility_min_confidence: 0.80
    require_responsibility_evidence: true
  adjudication:
    enabled: true
    model_id: codex-gpt-5.6-luna
    minimum_confidence: 0.70
  structural_priors:
    enabled: true
    confidence: 0.95
  output_directory: ../../consensus

observations: []

thresholds:
  min_gold_f1: 0.80
  min_gold_coverage: 0.90
  max_gold_f1_stddev: 0.03
  min_prediction_success_rate: 0.98
  min_json_validity_rate: 0.99
  max_truncation_rate: 0.01
  max_mean_duration_seconds: 60
  max_peak_memory_gb: 24
  baseline_prompt_id: structure-aware
  baseline_model_id: qwen3-14b-q4-k-m
  baseline_reasoning_mode_id: disabled
  max_gold_f1_drop: 0.02
